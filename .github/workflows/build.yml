name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip {} \;
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Build with Gradle
        run: |
          # Ищем папку app (она есть в любом проекте)
          APP_DIR=$(find . -type d -name "app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "Ошибка: Папка app не найдена!"
            ls -la
            exit 1
          fi
          
          # Корень проекта — это папка на уровень выше app
          PROJECT_DIR=$(dirname "$APP_DIR")
          cd "$PROJECT_DIR"
          echo "Сборка в папке: $(pwd)"
          
          # Удаляем старый wrapper и ставим свой
          rm -rf gradle/wrapper
          mkdir -p gradle/wrapper
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2-bin.zip" > gradle/wrapper/gradle-wrapper.properties
          
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
