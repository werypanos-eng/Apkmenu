name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip {} \;
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Build with Gradle
        run: |
          # Ищем папку с проектом (где лежит settings.gradle)
          PROJECT_DIR=$(find . -name "settings.gradle" -maxdepth 3 -type f | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -name "build.gradle" -maxdepth 3 -type f | head -n 1 | xargs dirname)
          fi
          
          cd "$PROJECT_DIR"
          echo "Сборка в папке: $(pwd)"
          
          # УДАЛЯЕМ встроенный сломанный gradlew и его конфиги
          rm -f gradlew gradlew.bat
          rm -rf gradle
          
          # Запускаем глобальный Gradle 8.5 (он уже установлен в системе)
          gradle assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
