name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip {} \;
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Setup Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2

      - name: Patch and Build
        run: |
          # 1. Ищем корень проекта
          PROJECT_DIR=$(find . -name "settings.gradle" -maxdepth 3 -type f | head -n 1 | xargs dirname)
          cd "$PROJECT_DIR"
          echo "Сборка в папке: $(pwd)"

          # 2. Жестко ставим плагин Android (AGP 8.1.4)
          sed -i 's|classpath .*com.android.tools.build:gradle:.*|classpath "com.android.tools.build:gradle:8.1.4"|' build.gradle

          # 3. Добавляем namespace в app/build.gradle (он обязателен для AGP 8+)
          if [ -f "app/build.gradle" ]; then
            if ! grep -q "namespace " app/build.gradle; then
              sed -i 's/android {/android {\n    namespace "com.lgl.modmenu"/' app/build.gradle
            fi
          fi

          # 4. Перезаписываем битый wrapper на 8.2
          rm -rf gradle/wrapper
          mkdir -p gradle/wrapper
          echo "distributionUrl=https\\://services.gradle.org/distributions/gradle-8.2-bin.zip" > gradle/wrapper/gradle-wrapper.properties

          # 5. Генерируем рабочий gradlew и собираем
          gradle wrapper --gradle-version 8.2
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
