name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip {} \;
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build with Gradle
        run: |
          PROJECT_DIR=$(find . -name "settings.gradle" -maxdepth 3 -type f | head -n 1 | xargs dirname)
          cd "$PROJECT_DIR"
          echo "Сборка в папке: $(pwd)"
          
          # 1. Патчим build.gradle, чтобы версия плагина Android (AGP) была совместима
          BUILD_GRADLE=$(find . -name "build.gradle" -maxdepth 2 -type f | head -n 1)
          if [ -f "$BUILD_GRADLE" ]; then
            sed -i 's|com.android.tools.build:gradle:.*|com.android.tools.build:gradle:8.1.4|' "$BUILD_GRADLE"
          fi
          
          # 2. Добавляем память в gradle.properties, чтобы не было InternalProblems
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties
          
          # 3. Удаляем их битый wrapper и создаем наш правильный
          rm -rf gradle/wrapper
          mkdir -p gradle/wrapper
          gradle wrapper --gradle-version 8.7
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
