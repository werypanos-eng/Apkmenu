name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Unzip project
        run: |
          find . -maxdepth 1 -name "*.zip" -exec unzip {} \;
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25b
          add-to-path: true

      - name: Fix Gradle Version and Build
        run: |
          # Ищем ВСЕ файлы настроек gradle и меняем в них битую версию 8.13 на 8.5
          find . -name "gradle-wrapper.properties" -exec sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-8.5-bin.zip|' {} +
          
          # Ищем папку с проектом (где лежит settings.gradle)
          PROJECT_DIR=$(find . -name "settings.gradle" -maxdepth 3 -type f | head -n 1 | xargs dirname)
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR=$(find . -name "build.gradle" -maxdepth 3 -type f | head -n 1 | xargs dirname)
          fi
          
          cd "$PROJECT_DIR"
          echo "Сборка в папке: $(pwd)"
          
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ModMenu-APK
          path: '**/app/build/outputs/apk/debug/*.apk'
